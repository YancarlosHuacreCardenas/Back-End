version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MiPassword123!
    ports:
      - "1433:1433"
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Yancarlos1", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10
      start_period: 10s

  backend:
    build: .
    container_name: springboot-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=hackathon
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Yancarlos1
      - PORT=8080
    ports:
      - "8080:8080"
    networks:
      - my-network

networks:
  my-network:
