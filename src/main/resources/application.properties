# Puerto del backend
server.port=${PORT:8080}

# Conexión a SQL Server en tu instancia EC2
spring.datasource.url=jdbc:sqlserver://34.202.228.49:1433;databaseName=AltavistaDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=MiPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ? Clave para que Hibernate respete los nombres camelCase de tu BD
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Para que el backend levante aunque la BD NO esté lista
spring.datasource.hikari.initialization-fail-timeout=0
spring.main.lazy-initialization=true
